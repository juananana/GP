ACMEPAY_BASE_URL: "https://api.acmepay.local/v2"
ACMEPAY_TOKEN: "${ACMEPAY_TOKEN}"
ACMEPAY_V1_BASE_URL: "https://api.acmepay.local/v1"
ACMEPAY_LEGACY_TOKEN: "${ACMEPAY_LEGACY_TOKEN}"
use_legacy_acmepay: true
partner_v1_base: "https://partners.acmepay.local/acmepay/v1"
legacy_webhook_path: "/webhooks/acmepay/v1/partner-events"
legacy_regions:
  - "eu-west"
  - "ap-south"
regional:
  eu-west:
    base_v1: "https://eu.acmepay.local/v1"
    token: "${ACMEPAY_EU_LEGACY_TOKEN}"
  ap-south:
    base_v1: "https://ap.acmepay.local/v1"
    token: "${ACMEPAY_AP_LEGACY_TOKEN}"

